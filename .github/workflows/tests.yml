name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python tests
        run: python -m unittest discover -s tests -t . -v

      - name: JavaScript syntax
        run: |
          for file in frontend/static/*.js connector/*.js *.js scripts/*.js; do
            node --check "$file"
          done

      # Clean install from package-lock.json, as on a new server (no browser download).
      - name: Install connector dependencies
        run: npm ci --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      # Includes a check that every module the connector requires can be loaded.
      - name: Connector tests
        run: |
          npm run check:connector
          npm test
