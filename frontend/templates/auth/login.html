<!doctype html>
<html lang="ru">
{{ head }}
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-brand"><span class="auth-brand-mark">Q</span><div><strong>Единая очередь</strong><small>{{ local_mode_text }}</small></div><button class="auth-theme-toggle" type="button" data-auth-theme-toggle>Тема</button></div>
      <h1>Вход в систему</h1>
      <p>Используйте личную учётную запись сотрудника.</p>
      {{ error_html }}
      {{ setup_hint }}
      <form method="post" action="/login" class="auth-form" autocomplete="on">
        <input type="hidden" name="next" value="{{ next_path }}">
        <label>Логин<input name="username" autocomplete="username" maxlength="32" required autofocus></label>
        <label>Пароль<input type="password" name="password" autocomplete="current-password" maxlength="256" required></label>
        <button class="auth-primary" type="submit">Войти</button>
      </form>
      <div class="auth-links">{{ registration_enabled_text }}<a href="/forgot-password">Восстановить пароль</a></div>
      <small class="auth-foot">Сеанс автоматически истекает через {{ session_hours }} ч.</small>
    </section>
  </main>
  {{ script }}
</body>
</html>
